# Drop-in configuration for needrestart to suppress whiptail interactive dialogs
# Target location: /etc/needrestart/conf.d/99-remnanode-auto.conf
#
# Values:
# 'i' - interactive (default on Debian/Ubuntu, triggers whiptail)
# 'a' - automatically restart services
# 'l' - list only, do not restart
$nrconf{restart} = 'a';
